services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: learning_lab
      POSTGRES_PASSWORD: learning_lab
      POSTGRES_DB: learning_lab
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_lab -d learning_lab"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
